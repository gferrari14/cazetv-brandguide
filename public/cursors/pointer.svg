<rect x="4" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/>
<!-- Knuckles top -->
<rect x="4" y="5" width="1" height="1"/>
<rect x="7" y="5" width="1" height="1"/><rect x="8" y="5" width="1" height="1"/>
<rect x="9" y="4" width="1" height="1"/><rect x="10" y="4" width="1" height="1"/>
<rect x="11" y="5" width="1" height="1"/>
<rect x="12" y="5" width="1" height="1"/>
<rect x="13" y="6" width="1" height="1"/>
<!-- Hand sides -->
<rect x="3" y="6" width="1" height="1"/>
<rect x="4" y="6" width="1" height="1"/>
<rect x="2" y="7" width="1" height="1"/>
<rect x="13" y="7" width="1" height="1"/>
<rect x="2" y="8" width="1" height="1"/>
<rect x="13" y="8" width="1" height="1"/>
<rect x="2" y="9" width="1" height="1"/>
<rect x="13" y="9" width="1" height="1"/>
<rect x="2" y="10" width="1" height="1"/>
<rect x="13" y="10" width="1" height="1"/>
<rect x="2" y="11" width="1" height="1"/>
<rect x="12" y="11" width="1" height="1"/>
<rect x="3" y="12" width="1" height="1"/>
<rect x="12" y="12" width="1" height="1"/>
<rect x="4" y="13" width="1" height="1"/>
<rect x="11" y="13" width="1" height="1"/>
<rect x="5" y="14" width="1" height="1"/><rect x="6" y="14" width="1" height="1"/><rect x="7" y="14" width="1" height="1"/><rect x="8" y="14" width="1" height="1"/><rect x="9" y="14" width="1" height="1"/><rect x="10" y="14" width="1" height="1"/><rect x="11" y="14" width="1" height="1"/>
</g>
<g fill="#ffffff">
<!-- Index finger inside -->
<rect x="5" y="1" width="2" height="4"/>
<!-- Palm fill -->
<rect x="5" y="5" width="2" height="1"/>
<rect x="8" y="5" width="1" height="0"/>
<rect x="3" y="7" width="10" height="1"/>
<rect x="3" y="8" width="10" height="1"/>
<rect x="3" y="9" width="10" height="1"/>
<rect x="3" y="10" width="10" height="1"/>
<rect x="3" y="11" width="9" height="1"/>
<rect x="4" y="12" width="8" height="1"/>
<rect x="5" y="13" width="6" height="1"/>
<!-- Top knuckle gaps fill -->
<rect x="8" y="6" width="5" height="1"/>
<rect x="5" y="6" width="2" height="1"/>
<rect x="9" y="5" width="2" height="0"/>
</g>
</svg>
