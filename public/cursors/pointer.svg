<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 16 16" shape-rendering="crispEdges">
<!-- Retro pixel pointing hand cursor. Black outline, white fill, transparent background. -->
<g fill="#000000">
<!-- Index finger outline -->
<rect x="5" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/>
<rect x="4" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/>
