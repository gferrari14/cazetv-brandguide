<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 20 20" shape-rendering="crispEdges">
<!-- Classic Windows-style pixel pointing-hand cursor.
     Black = outline, White = fill, transparent elsewhere. -->
<g fill="#000000">
<!-- Index finger outline (top) -->
<rect x="6" y="1"  width="2" height="1"/>
<rect x="5" y="2"  width="1" height="1"/><rect x="8" y="2"  width="1" height="1"/>
<rect x="5" y="3"  width="1" height="1"/><rect x="8" y="3"  width="1" height="1"/>
<rect x="5" y="4"  width="1" height="1"/><rect x="8" y="4"  width="1" height="1"/>
<rect x="5" y="5"  width="1" height="1"/><rect x="8" y="5"  width="1" height="1"/>
<rect x="5" y="6"  width="1" height="1"/>
<!-- Top of hand (knuckles) -->
<rect x="8" y="6"  width="1" height="1"/><rect x="9" y="6"  width="1" height="1"/>
<rect x="10" y="5" width="1" height="1"/><rect x="11" y="5" width="1" height="1"/>
<rect x="12" y="6" width="1" height="1"/>
<rect x="13" y="5" width="1" height="1"/><rect x="14" y="5" width="1" height="1"/>
<rect x="15" y="6" width="1" height="1"/>
<rect x="16" y="7" width="1" height="1"/>
<!-- Left side of hand -->
<rect x="4" y="7"  width="1" height="1"/>
<rect x="3" y="8"  width="1" height="1"/>
<rect x="3" y="9"  width="1" height="1"/>
<rect x="3" y="10" width="1" height="1"/>
<rect x="3" y="11" width="1" height="1"/>
<rect x="3" y="12" width="1" height="1"/>
<rect x="4" y="13" width="1" height="1"/>
<rect x="5" y="14" width="1" height="1"/>
<rect x="6" y="15" width="1" height="1"/>
<!-- Right side of hand -->
<rect x="16" y="8"  width="1" height="1"/>
<rect x="16" y="9"  width="1" height="1"/>
<rect x="16" y="10" width="1" height="1"/>
<rect x="16" y="11" width="1" height="1"/>
<rect x="16" y="12" width="1" height="1"/>
<rect x="15" y="13" width="1" height="1"/>
<rect x="15" y="14" width="1" height="1"/>
<rect x="14" y="15" width="1" height="1"/>
<!-- Bottom edge -->
<rect x="7" y="16" width="8" height="1"/>
</g>
<g fill="#ffffff">
<!-- Index finger fill -->
<rect x="6" y="2" width="2" height="4"/>
<!-- Top of hand fill between finger tops -->
<rect x="6" y="6" width="2" height="1"/>
<rect x="9" y="6" width="1" height="1"/>
<rect x="10" y="6" width="2" height="1"/>
<rect x="13" y="6" width="2" height="1"/>
<!-- Hand body fill -->
<rect x="5" y="7"  width="11" height="1"/>
<rect x="4" y="8"  width="12" height="1"/>
<rect x="4" y="9"  width="12" height="1"/>
<rect x="4" y="10" width="12" height="1"/>
<rect x="4" y="11" width="12" height="1"/>
<rect x="4" y="12" width="12" height="1"/>
<rect x="5" y="13" width="10" height="1"/>
<rect x="6" y="14" width="9"  height="1"/>
<rect x="7" y="15" width="7"  height="1"/>
</g>
</svg>
